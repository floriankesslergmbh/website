title: Florian Kessler GmbH
baseURL: https://fke.systems
defaultContentLanguage: de
enableGitInfo: true

module:
  imports:
    - path: github.com/imfing/hextra

markup:
  goldmark:
    renderer:
      unsafe: true

  highlight:
    noClasses: false

menu:
  main:
    - name: Theme
      weight: 1
      params:
        type: theme-toggle
    - name: Search
      weight: 2
      params:
        type: search

params:
  navbar:
    displayTitle: false
    displayLogo: true
    logo:
      path: images/logo.svg
      dark: images/logo-dark.svg
      width: 200
      height: 42

  footer:
    displayCopyright: false
    displayPoweredBy: false
